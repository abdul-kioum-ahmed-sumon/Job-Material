# Render Blueprint specification for Post2PDF (Single Unified Service)
# https://render.com/docs/blueprint-spec

services:
  # ─── Unified FastAPI + React Web Service ──────────────────────────
  - type: web
    name: post2pdf
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MAX_IMAGE_SIZE_MB
        value: "15"
      - key: MAX_IMAGES
        value: "100"
      - key: MAX_TOTAL_UPLOAD_MB
        value: "100"
      - key: FACEBOOK_REQUEST_TIMEOUT
        value: "15"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
